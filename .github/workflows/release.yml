name: Build, Sign and Release Firefox Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release Channel (unlisted for direct .xpi download, listed for public store)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - listed

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Sign Extension via Mozilla Add-ons (AMO)
        id: sign
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'unlisted' }}"
          echo "Signing channel: $CHANNEL"
          npx web-ext sign \
            --source-dir dist \
            --artifacts-dir signed-artifacts \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}" \
            --channel "$CHANNEL"

      - name: Upload Signed Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bagmark-signed-extension
          path: signed-artifacts/*

      - name: Upload Signed Artifacts as Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: signed-artifacts/*
          generate_release_notes: true

