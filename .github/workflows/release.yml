name: Build, Sign and Release Firefox Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.0.2). If left empty, uses git tag or package.json'
        required: false
        type: string
      channel:
        description: 'Release Channel (unlisted for direct .xpi download, listed for public store)'
        required: true
        default: 'unlisted'
        type: choice
        options:
          - unlisted
          - listed

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Determine & Apply Version
        id: versioning
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "Building BagMark version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Synchronize package.json & manifest.json
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('./manifest.json', 'utf8'));
            manifest.version = '$VERSION';
            fs.writeFileSync('./manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Run Tests
        run: npm test

      - name: Build Extension
        run: npm run build

      - name: Sign Extension via Mozilla Add-ons (AMO)
        id: sign
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'unlisted' }}"
          echo "Signing channel: $CHANNEL"
          npx web-ext sign \
            --source-dir dist \
            --artifacts-dir signed-artifacts \
            --api-key "${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret "${{ secrets.AMO_JWT_SECRET }}" \
            --channel "$CHANNEL"

      - name: Upload Signed Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: bagmark-v${{ steps.versioning.outputs.version }}-signed
          path: signed-artifacts/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: signed-artifacts/*
          name: "BagMark v${{ steps.versioning.outputs.version }}"
          generate_release_notes: true
